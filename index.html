<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>네이버 블로그 원고 자동 생성기</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
  <style>
    @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css');
    body {
      font-family: 'Pretendard', sans-serif;
    }
  </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen">
  <nav class="bg-emerald-600 text-white shadow-md">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-4 flex justify-between items-center">
      <div class="flex items-center space-x-3">
        <i class="fa-solid fa-pen-nib text-2xl text-emerald-200"></i>
        <h1 class="text-xl font-bold tracking-tight">네이버 블로그 AI 원고 생성기</h1>
      </div>
      <span class="text-xs bg-emerald-700 px-3 py-1 rounded-full text-emerald-100">Target: 2200~2400자 (공백제외)</span>
    </div>
  </nav>

  <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
    <div class="grid grid-cols-1 lg:grid-cols-12 gap-8">
      
      <section class="lg:col-span-5 bg-white p-6 rounded-2xl shadow-sm border border-slate-200 h-fit">
        <h2 class="text-lg font-bold text-slate-900 mb-4 flex items-center gap-2">
          <i class="fa-solid fa-sliders text-emerald-600"></i> 포스팅 설정
        </h2>

        <form id="generatorForm" class="space-y-5" onsubmit="event.preventDefault(); generatePost();">
          <!-- 글 유형 선택 -->
          <div>
            <label class="block text-sm font-semibold text-slate-700 mb-2">포스팅 성격</label>
            <div class="grid grid-cols-2 gap-3">
              <label class="cursor-pointer">
                <input type="radio" name="postType" value="info" class="peer sr-only" checked>
                <div class="p-3 text-center rounded-xl border border-slate-200 peer-checked:border-emerald-600 peer-checked:bg-emerald-50 peer-checked:text-emerald-700 hover:bg-slate-50 transition">
                  <i class="fa-solid fa-book-open mb-1 block text-lg"></i>
                  <span class="text-sm font-medium">정보성 포스팅</span>
                </div>
              </label>
              <label class="cursor-pointer">
                <input type="radio" name="postType" value="promo" class="peer sr-only">
                <div class="p-3 text-center rounded-xl border border-slate-200 peer-checked:border-emerald-600 peer-checked:bg-emerald-50 peer-checked:text-emerald-700 hover:bg-slate-50 transition">
                  <i class="fa-solid fa-bullhorn mb-1 block text-lg"></i>
                  <span class="text-sm font-medium">홍보성 포스팅</span>
                </div>
              </label>
            </div>
          </div>

          <!-- 업체명 / 브랜드명 -->
          <div>
            <label for="companyName" class="block text-sm font-semibold text-slate-700 mb-1">업체명 / 상호명</label>
            <input type="text" id="companyName" required placeholder="예: 맛있는 맛집 강남점, 헤어살롱 디자이너OO" class="w-full px-4 py-2.5 rounded-xl border border-slate-300 focus:ring-2 focus:ring-emerald-500 focus:border-emerald-500 text-sm">
          </div>

          <!-- 핵심 키워드 -->
          <div>
            <label for="keywords" class="block text-sm font-semibold text-slate-700 mb-1">메인/서브 키워드 (쉼표 구분)</label>
            <input type="text" id="keywords" required placeholder="예: 강남역 맛집, 강남 데이트 코스, 삼겹살 추천" class="w-full px-4 py-2.5 rounded-xl border border-slate-300 focus:ring-2 focus:ring-emerald-500 focus:border-emerald-500 text-sm">
            <p class="text-xs text-slate-400 mt-1">네이버 검색 노출을 높이기 위해 핵심 키워드를 입력해주세요.</p>
          </div>

          <!-- 상세 특징 및 가이드 -->
          <div>
            <label for="details" class="block text-sm font-semibold text-slate-700 mb-1">강점 / 특장점 / 가이드 사항</label>
            <textarea id="details" rows="4" placeholder="예: 
- 100% 제주산 흑돼지만 사용
- 주차 공간 넓음 (2시간 무료)
- 단체석 완비, 네이버 예약 시 음료 서비스" class="w-full px-4 py-2.5 rounded-xl border border-slate-300 focus:ring-2 focus:ring-emerald-500 focus:border-emerald-500 text-sm"></textarea>
          </div>

          <!-- 어조 선택 -->
          <div>
            <label for="tone" class="block text-sm font-semibold text-slate-700 mb-1">문체 / 말투</label>
            <select id="tone" class="w-full px-4 py-2.5 rounded-xl border border-slate-300 focus:ring-2 focus:ring-emerald-500 focus:border-emerald-500 text-sm">
              <option value="친근하고 생생한 네이버 블로거 체 (~해요, ~했답니다)">친근한 블로거 체 (~해요, ~했답니다)</option>
              <option value="전문적이고 신뢰감 있는 체 (~합니다, ~입니다)">전문적인 단정한 체 (~합니다, ~입니다)</option>
              <option value="솔직한 후기성 서솔 체 (~했음, ~추천함)">솔직한 후기 체 (~했음, ~좋았음)</option>
            </select>
          </div>

          <!-- 제출 버튼 -->
          <button type="submit" id="generateBtn" class="w-full py-3.5 px-4 bg-emerald-600 hover:bg-emerald-700 text-white font-bold rounded-xl shadow-md hover:shadow-lg transition flex items-center justify-center gap-2">
            <i class="fa-solid fa-wand-magic-sparkles"></i>
            <span>원고 자동 생성하기</span>
          </button>
        </form>
      </section>

      <section class="lg:col-span-7 flex flex-col h-full">
        <div class="bg-white rounded-2xl shadow-sm border border-slate-200 flex flex-col h-full min-h-[600px] p-6">
          <!-- 상단 툴바 및 글자수 모니터링 -->
          <div class="flex flex-wrap items-center justify-between gap-4 pb-4 border-b border-slate-100">
            <div class="flex items-center gap-2">
              <i class="fa-regular fa-file-lines text-emerald-600 text-xl"></i>
              <h2 class="text-lg font-bold text-slate-900">생성된 원고</h2>
              <!-- 보기 모드 탭 추가 -->
              <div class="ml-2 inline-flex p-1 bg-slate-100 rounded-lg text-xs font-medium">
                <button type="button" id="tabRawBtn" onclick="switchTab('raw')" class="px-3 py-1 rounded-md bg-white text-slate-800 shadow-sm transition">블로그용 (기호 제거)</button>
                <button type="button" id="tabPreviewBtn" onclick="switchTab('preview')" class="px-3 py-1 rounded-md text-slate-500 hover:text-slate-800 transition">서식 미리보기</button>
              </div>
            </div>
            
            <div class="flex items-center gap-4">
              <!-- 글자 수 카운터 -->
              <div class="text-xs bg-slate-100 px-3 py-1.5 rounded-lg border border-slate-200">
                <span>공백 제외: </span>
                <strong id="charCountNoSpace" class="text-emerald-600 text-sm">0</strong> / 2400자
                <span class="text-slate-400 mx-1">|</span>
                <span>공백 포함: </span>
                <span id="charCountWithSpace" class="text-slate-600">0</span>자
              </div>
              
              <!-- 복사 버튼 -->
              <button onclick="copyToClipboard()" id="copyBtn" disabled class="px-3.5 py-1.5 bg-slate-800 hover:bg-slate-900 text-white text-xs font-semibold rounded-lg transition flex items-center gap-1.5 disabled:opacity-40 disabled:cursor-not-allowed">
                <i class="fa-regular fa-copy"></i>
                <span>복사하기</span>
              </button>
            </div>
          </div>

          <!-- 콘텐츠 로딩 표시 -->
          <div id="loadingState" class="hidden flex-1 flex flex-col items-center justify-center p-8 text-center">
            <div class="w-12 h-12 border-4 border-emerald-200 border-t-emerald-600 rounded-full animate-spin mb-4"></div>
            <p class="font-semibold text-slate-700">고품질 네이버 블로그 원고를 작성하는 중입니다...</p>
            <p class="text-xs text-slate-400 mt-1">목표 글자수(공백제외 2200~2400자)에 맞추어 풍부한 내용으로 구성 중입니다. 약 10~20초 소요됩니다.</p>
          </div>

          <!-- 빈 상태 안내 -->
          <div id="emptyState" class="flex-1 flex flex-col items-center justify-center p-8 text-center text-slate-400">
            <i class="fa-solid fa-pen-to-square text-5xl mb-3 text-slate-200"></i>
            <p class="text-sm font-medium">좌측 상단 설정을 입력한 후 '원고 자동 생성하기' 버튼을 눌러주세요.</p>
          </div>

          <!-- 결과 출력 에디터 (기본 텍스트 뷰) -->
          <div id="outputContainer" class="hidden flex-1 flex flex-col mt-4">
            <textarea id="resultTextarea" oninput="updateCharCount()" class="w-full flex-1 p-4 bg-slate-50 border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-emerald-500 font-sans text-slate-800 text-sm leading-relaxed resize-none min-h-[500px]" placeholder="생성된 원고가 이곳에 표시됩니다. 자유롭게 수정할 수 있습니다."></textarea>
            
            <!-- HTML 서식 미리보기 뷰 -->
            <div id="previewContainer" class="hidden w-full flex-1 p-6 bg-white border border-slate-200 rounded-xl overflow-y-auto min-h-[500px] text-slate-800 text-sm leading-relaxed space-y-4"></div>
          </div>
        </div>
      </section>

    </div>
  </main>

  <!-- 알림 메시지 토스트 -->
  <div id="toast" class="fixed bottom-5 right-5 bg-slate-900 text-white text-sm px-4 py-3 rounded-xl shadow-lg transition-opacity duration-300 opacity-0 pointer-events-none flex items-center gap-2">
    <i class="fa-solid fa-circle-check text-emerald-400"></i>
    <span id="toastMsg">클립보드에 복사되었습니다!</span>
  </div>

  <script>
    let rawMarkdownContent = "";

    // 마크다운 기호를 네이버 블로그에 최적화된 순수 텍스트로 정제
    function cleanMarkdownForBlog(text) {
      return text
        .replace(/^###?\s*(.*$)/gim, '\n[ $1 ]\n') // # 또는 ## 소제목을 [ 소제목 ] 형태로 자연스럽게 정제
        .replace(/\*\*(.*?)\*\*/g, '$1')            // **두꺼운 글씨** 기호 제거
        .replace(/\*(.*?)\*/g, '$1')                // *기울임* 기호 제거
        .replace(/~~(.*?)~~/g, '$1')                // ~~취소선~~ 기호 제거
        .replace(/^---$/gim, '\n----------------------------------------\n') // --- 구분선을 깔끔한 줄바꿈 구분선으로 변경
        .replace(/`{1,3}(.*?)`{1,3}/g, '$1')        // 코드 블록 기호 제거
        .replace(/\n{3,}/g, '\n\n');                 // 과도한 공백 줄 정돈
    }

    // 마크다운을 시각적 HTML 미리보기용으로 변환
    function renderMarkdownToHtml(text) {
      return text
        .replace(/^### (.*$)/gim, '<h3 class="text-base font-bold text-slate-800 mt-4 mb-2">$1</h3>')
        .replace(/^## (.*$)/gim, '<h2 class="text-lg font-bold text-emerald-700 mt-6 mb-3 pb-1 border-b border-emerald-100">$1</h2>')
        .replace(/^# (.*$)/gim, '<h1 class="text-xl font-extrabold text-slate-900 mt-6 mb-4">$1</h1>')
        .replace(/\*\*(.*?)\*\*/g, '<strong class="font-bold text-slate-900 bg-emerald-50 px-1 rounded">$1</strong>')
        .replace(/^---$/gim, '<hr class="my-6 border-slate-200">')
        .replace(/\n/g, '<br>');
    }

    // 탭 전환 (블로그용 순수 텍스트 / HTML 서식 미리보기)
    function switchTab(mode) {
      const textarea = document.getElementById('resultTextarea');
      const preview = document.getElementById('previewContainer');
      const rawBtn = document.getElementById('tabRawBtn');
      const previewBtn = document.getElementById('tabPreviewBtn');

      if (mode === 'raw') {
        textarea.classList.remove('hidden');
        preview.classList.add('hidden');
        rawBtn.className = "px-3 py-1 rounded-md bg-white text-slate-800 shadow-sm transition font-semibold";
        previewBtn.className = "px-3 py-1 rounded-md text-slate-500 hover:text-slate-800 transition";
      } else {
        textarea.classList.add('hidden');
        preview.classList.remove('hidden');
        preview.innerHTML = renderMarkdownToHtml(rawMarkdownContent || textarea.value);
        previewBtn.className = "px-3 py-1 rounded-md bg-white text-slate-800 shadow-sm transition font-semibold";
        rawBtn.className = "px-3 py-1 rounded-md text-slate-500 hover:text-slate-800 transition";
      }
    }

    // 글자 수 카운팅 함수 (공백 제외 및 공백 포함)
    function updateCharCount() {
      const textarea = document.getElementById('resultTextarea');
      const text = textarea.value;
      
      const countWithSpace = text.length;
      const countNoSpace = text.replace(/\s/g, '').length;

      const charNoSpaceElem = document.getElementById('charCountNoSpace');
      const charWithSpaceElem = document.getElementById('charCountWithSpace');

      charNoSpaceElem.innerText = countNoSpace.toLocaleString();
      charWithSpaceElem.innerText = countWithSpace.toLocaleString();

      if (countNoSpace >= 2100 && countNoSpace <= 2500) {
        charNoSpaceElem.className = "text-emerald-600 text-sm font-bold";
      } else if (countNoSpace > 0) {
        charNoSpaceElem.className = "text-amber-600 text-sm font-bold";
      } else {
        charNoSpaceElem.className = "text-slate-600 text-sm";
      }
    }

    // 클립보드 복사 함수
    function copyToClipboard() {
      const textarea = document.getElementById('resultTextarea');
      if (!textarea.value) return;

      textarea.select();
      document.execCommand('copy');
      
      showToast('원고가 클립보드에 복사되었습니다! 네이버 블로그에 붙여넣으세요.');
    }

    // 토스트 메시지 출력
    function showToast(message) {
      const toast = document.getElementById('toast');
      const toastMsg = document.getElementById('toastMsg');
      toastMsg.innerText = message;
      
      toast.classList.remove('opacity-0', 'pointer-events-none');
      toast.classList.add('opacity-100');
      
      setTimeout(() => {
        toast.classList.remove('opacity-100');
        toast.classList.add('opacity-0', 'pointer-events-none');
      }, 3000);
    }

    // 지연 지수 백오프 방식의 API 호출 retry 함수
    async function fetchWithRetry(url, options, retries = 3, backoff = 1000) {
      try {
        const response = await fetch(url, options);
        if (!response.ok) {
          throw new Error(`HTTP error! status: ${response.status}`);
        }
        return await response.json();
      } catch (err) {
        if (retries > 0) {
          await new Promise(res => setTimeout(res, backoff));
          return fetchWithRetry(url, options, retries - 1, backoff * 2);
        } else {
          throw err;
        }
      }
    }

    // AI 원고 생성 메인 로직
    async function generatePost() {
      const postType = document.querySelector('input[name="postType"]:checked').value;
      const companyName = document.getElementById('companyName').value.trim();
      const keywords = document.getElementById('keywords').value.trim();
      const details = document.getElementById('details').value.trim();
      const tone = document.getElementById('tone').value;

      if (!companyName || !keywords) {
        alert('업체명과 키워드는 필수 입력 항목입니다.');
        return;
      }

      // UI 상태 변경 (로딩 중)
      document.getElementById('emptyState').classList.add('hidden');
      document.getElementById('outputContainer').classList.add('hidden');
      document.getElementById('loadingState').classList.remove('hidden');
      document.getElementById('generateBtn').disabled = true;

      const systemInstruction = `당신은 대한민국 최고의 네이버 블로그 전문 마케팅 에이전시 카피라이터입니다.
네이버 스마트블록/C-Rank/DIA 로직에 최적화된 블로그 원고를 작성합니다.

[핵심 필수 규칙]
1. 글자 수: **공백 제외 분량이 반드시 2,200자 ~ 2,400자 사이**가 되도록 풍부하고 디테일하게 서술하세요. 절대로 짧게 끝내지 마세요.
2. 서론, 본론(소제목 3~4개 포함), 결론/위치안내 구조로 알차게 구성하세요.
3. 소제목과 가독성 좋은 줄바꿈, 이모지를 적절히 사용하여 블로그 독자가 읽기 쉽게 작성하세요.
4. 마크다운 기호(**, ##, --- 등)를 사용하더라도 네이버 블로그 원고 형식에 잘 맞도록 구성하세요.
5. 키워드를 자연스럽게 반복 언급하되 오뷰즈(도배)가 되지 않도록 하세요.
6. 블로그 특유의 생생하고 후기같은 흐름을 유지하세요.
7. **원고의 제일 마지막 부분에는 입력받은 키워드 및 업체와 관련된 네이버 블로그 검색용 #태그 (해시태그) 10개를 띄어쓰기로 구분하여 적어주세요. (예: #강남맛집 #강남역삼겹살 #강남데이트 ...)**`;

      const userPrompt = `다음 정보를 바탕으로 네이버 블로그 원고를 작성해 주세요.

- 원고 유형: ${postType === 'info' ? '정보성 포스팅 (유용한 정보를 기반으로 자연스럽게 언급)' : '홍보성/후기성 포스팅 (업체의 장점과 매력을 적극적으로 강조)'}
- 업체/상호명: ${companyName}
- 핵심 키워드: ${keywords}
- 세부 특장점 및 내용: ${details || '자유롭게 구체적인 상황과 장점을 풍부하게 연출'}
- 어조/말투: ${tone}

[분량 및 태그 요구사항 - 극도로 중요]
- 글자 수 제한: 공백 제외 2,200자 ~ 2,400자 분량 (본문 내용)
- 문장을 구체적인 상황 묘사, 구체적인 팁, 이유, 후기 감상 등으로 풍부하게 늘려서 정성을 다해 길게 작성해 주세요.
- 맨 마지막에는 관련 연관 키워드로 구성된 #태그 10개를 반드시 포함해 주세요.`;

      const apiKey = "";
      const apiUrl = `https://generativelanguage.googleapis.com/v1beta/models/gemini-3-flash-preview:generateContent?key=${apiKey}`;

      const payload = {
        contents: [
          {
            parts: [{ text: userPrompt }]
          }
        ],
        systemInstruction: {
          parts: [{ text: systemInstruction }]
        }
      };

      try {
        const result = await fetchWithRetry(apiUrl, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });

        const candidate = result.candidates?.[0];
        if (candidate && candidate.content?.parts?.[0]?.text) {
          rawMarkdownContent = candidate.content.parts[0].text;
          
          // 마크다운 기호 정제 후 블로그용 텍스트 저장
          const cleanedText = cleanMarkdownForBlog(rawMarkdownContent);
          
          const resultTextarea = document.getElementById('resultTextarea');
          resultTextarea.value = cleanedText;
          
          // UI 상태 변경 (완료)
          document.getElementById('loadingState').classList.add('hidden');
          document.getElementById('outputContainer').classList.remove('hidden');
          document.getElementById('copyBtn').disabled = false;
          
          switchTab('raw'); // 기본적으로 정제된 블로그용 탭으로 보기
          updateCharCount();
          showToast('원고가 성공적으로 생성되었습니다!');
        } else {
          throw new Error('원고를 생성하지 못했습니다.');
        }
      } catch (error) {
        console.error('API Error:', error);
        alert('원고 생성 중 오류가 발생했습니다. 잠시 후 다시 시도해 주세요.');
        document.getElementById('loadingState').classList.add('hidden');
        document.getElementById('emptyState').classList.remove('hidden');
      } finally {
        document.getElementById('generateBtn').disabled = false;
      }
    }
  </script>
</body>
</html>
